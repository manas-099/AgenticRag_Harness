[project]
name = "rag-harness"
version = "0.1.0"
description = "Agentic RAG Harness backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.0",
    "fastapi>=0.110",
    "firecrawl-anydoc>=0.1",
    "groq>=0.11",
    "langchain-text-splitters>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pymupdf>=1.24",
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "qdrant-client[fastembed]>=1.9",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "rich>=13.7",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "uvicorn[standard]>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
