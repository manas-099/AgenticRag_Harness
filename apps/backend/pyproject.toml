[project]
name = "rag-harness"
version = "0.1.0"
description = "Agentic RAG Harness backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0.0,<6.0.0",
    "docling>=2.0,<3.0",
    "fastapi>=0.110,<1.0",
    "firecrawl-anydoc>=0.1,<1.0",
    "groq>=0.11,<1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0,<2.0",
    "langchain-google-vertexai",
    "langchain-huggingface>=0.1.0,<1.0",
    "langchain-openai>=0.3.0,<1.0",
    "langchain-text-splitters>=0.2,<1.0",
    "langgraph>=1.2.0,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pymupdf>=1.24,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.14,<4.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9",
    "qdrant-client[fastembed]>=1.9,<2.0",
    "ragas>=0.2.0,<0.3.0",
    "rank-bm25>=0.2.2,<1.0",
    "requests>=2.31,<3.0",
    "rich>=13.7,<14.0",
    "sentence-transformers>=3.0,<4.0",
    "torch>=2.2,<3.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pyrefly]
ignore_missing_stubs = ["fastapi", "fastapi.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
